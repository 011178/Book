
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bookworm</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Our CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MAIN CONTENT -->
  <main class="container-fluid px-4 py-5">


    <!-- BOOK COLLECTION -->
    <section>

      <div class="row g-4" id="bookCollection">


        <!-- BOOK 1 -->
        <div class="col-md-6 col-lg-4">

          <div class="card book-card h-100">

            <div class="cover-wrap">

              <input
                type="checkbox"
                class="cover-check"
                aria-label="Select book"
              >

              <button
                type="button"
                class="cover-menu"
                aria-label="More options"
              >
                <i class="bi bi-three-dots-vertical"></i>
              </button>

              <img
                src="https://placehold.co/200x280/1a1a2e/ffffff?text=Harry+Potter"
                class="card-img-top"
                alt="Harry Potter cover"
              >

              <button
                type="button"
                class="btn btn-read cover-read"
              >
                Read Book
              </button>

            </div>


            <div class="card-body">

              <h5 class="card-title">
                Harry Potter
              </h5>

              <p class="card-text book-author">
                Author: J.K. Rowling
              </p>

              <p class="text-muted book-genre">
                Genre: Fantasy
              </p>


              <!-- REVIEW SECTION -->
              <details class="review-panel">

                <summary>Rate &amp; Review</summary>

                <h6>Rate This Book</h6>

                <select class="form-select rating mb-2">
                  <option value="5">⭐⭐⭐⭐⭐</option>
                  <option value="4">⭐⭐⭐⭐</option>
                  <option value="3">⭐⭐⭐</option>
                  <option value="2">⭐⭐</option>
                  <option value="1">⭐</option>
                </select>

                <textarea
                  class="form-control review mb-2"
                  placeholder="Write your review..."
                ></textarea>

                <button
                  class="btn btn-read"
                  onclick="addReview(this)"
                >
                  Submit Review
                </button>

                <div class="review-list mt-3"></div>

              </details>

            </div>

          </div>
        </div>



        <!-- BOOK 2 -->
        <div class="col-md-6 col-lg-4">

          <div class="card book-card h-100">

            <div class="cover-wrap">

              <input
                type="checkbox"
                class="cover-check"
                aria-label="Select book"
              >

              <button
                type="button"
                class="cover-menu"
                aria-label="More options"
              >
                <i class="bi bi-three-dots-vertical"></i>
              </button>

              <img
                src="https://placehold.co/200x280/16213e/ffffff?text=Percy+Jackson"
                class="card-img-top"
                alt="Percy Jackson cover"
              >

              <button
                type="button"
                class="btn btn-read cover-read"
              >
                Read Book
              </button>

            </div>


            <div class="card-body">

              <h5 class="card-title">
                Percy Jackson
              </h5>

              <p class="card-text book-author">
                Author: Rick Riordan
              </p>

              <p class="text-muted book-genre">
                Genre: Adventure
              </p>


              <!-- REVIEW SECTION -->
              <details class="review-panel">

                <summary>Rate &amp; Review</summary>

                <h6>Rate This Book</h6>

                <select class="form-select rating mb-2">
                  <option value="5">⭐⭐⭐⭐⭐</option>
                  <option value="4">⭐⭐⭐⭐</option>
                  <option value="3">⭐⭐⭐</option>
                  <option value="2">⭐⭐</option>
                  <option value="1">⭐</option>
                </select>

                <textarea
                  class="form-control review mb-2"
                  placeholder="Write your review..."
                ></textarea>

                <button
                  class="btn btn-read"
                  onclick="addReview(this)"
                >
                  Submit Review
                </button>

                <div class="review-list mt-3"></div>

              </details>

            </div>

          </div>
        </div>



        <!-- BOOK 3 -->
        <div class="col-md-6 col-lg-4">

          <div class="card book-card h-100">

            <div class="cover-wrap">

              <input
                type="checkbox"
                class="cover-check"
                aria-label="Select book"
              >

              <button
                type="button"
                class="cover-menu"
                aria-label="More options"
              >
                <i class="bi bi-three-dots-vertical"></i>
              </button>

              <img
                src="https://placehold.co/200x280/0f3460/ffffff?text=Wimpy+Kid"
                class="card-img-top"
                alt="Diary of a Wimpy Kid cover"
              >

              <button
                type="button"
                class="btn btn-read cover-read"
              >
                Read Book
              </button>

            </div>


            <div class="card-body">

              <h5 class="card-title">
                Diary of a Wimpy Kid
              </h5>

              <p class="card-text book-author">
                Author: Jeff Kinney
              </p>

              <p class="text-muted book-genre">
                Genre: Comedy
              </p>


              <!-- REVIEW SECTION -->
              <details class="review-panel">

                <summary>Rate &amp; Review</summary>

                <h6>Rate This Book</h6>

                <select class="form-select rating mb-2">
                  <option value="5">⭐⭐⭐⭐⭐</option>
                  <option value="4">⭐⭐⭐⭐</option>
                  <option value="3">⭐⭐⭐</option>
                  <option value="2">⭐⭐</option>
                  <option value="1">⭐</option>
                </select>

                <textarea
                  class="form-control review mb-2"
                  placeholder="Write your review..."
                ></textarea>

                <button
                  class="btn btn-read"
                  onclick="addReview(this)"
                >
                  Submit Review
                </button>

                <div class="review-list mt-3"></div>

              </details>

            </div>

          </div>
        </div>



        <!-- ADD NEW BOOK -->
        <div class="col-md-6 col-lg-4">

          <div class="add-book-card h-100 d-flex flex-column align-items-center justify-content-center">

            <details class="add-book-section w-100">

              <summary class="add-summary">

                <span class="add-plus">+</span>

                <span class="add-label">
                  Add New Book
                </span>

              </summary>


              <!-- ADD BOOK FORM -->
              <div class="add-book-form mt-3 px-2">

                <div class="row g-2">


                  <!-- BOOK TITLE -->
                  <div class="col-12">

                    <input
                      type="text"
                      id="bookTitle"
                      class="form-control form-control-sm"
                      placeholder="Book Title"
                    >

                  </div>


                  <!-- AUTHOR -->
                  <div class="col-12">

                    <input
                      type="text"
                      id="bookAuthor"
                      class="form-control form-control-sm"
                      placeholder="Author Name"
                    >

                  </div>


                  <!-- GENRE -->
                  <div class="col-12">

                    <select
                      id="bookGenre"
                      class="form-select form-select-sm"
                    >

                      <option value="">
                        Choose Genre
                      </option>

                      <option>Adventure</option>
                      <option>Mystery</option>
                      <option>Thriller</option>
                      <option>Comedy</option>
                      <option>Fantasy</option>
                      <option>Science Fiction</option>
                      <option>Romance</option>

                    </select>

                  </div>


                  <!-- BOOK IMAGE -->
                  <div class="col-12">

                    <input
                      type="text"
                      id="bookImage"
                      class="form-control form-control-sm"
                      placeholder="Book Cover Image URL"
                    >

                  </div>


                  <!-- ADD BOOK BUTTON -->
                  <div class="col-12">

                    <button
                      class="btn btn-read w-100"
                      onclick="addBook()"
                    >
                      + Add Book
                    </button>

                  </div>

                </div>

              </div>

            </details>

          </div>

        </div>


      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->
  <script src="index.js"></script>

</body>
</html>
